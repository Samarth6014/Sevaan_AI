greet: "Hello! I help you apply for central government scholarships. Everything here is a demo with synthetic data. I will ask a few simple questions."
q_family_income_annual: "What is your family's total income in a year?"
q_current_level: "Which class are you studying in now?"
q_institution_type: "Is your school government, aided, local body or private?"
q_marks_pct_class7: "What percentage of marks did you get in Class 7?"
q_category: "What is your category: GEN, SC, ST, OBC or EWS?"
heard: "I heard {field} = {value}. Is that right? Reply yes or no."
unknown_noted: "Okay, I will mark that as unknown. A human helper can check it."
matched_header: "Here is what I found:"
eligible_line: "You can apply for {name}."
not_eligible_line: "Not eligible for {name}: {why}"
unknown_line: "I cannot tell yet for {name}: {why}"
conflict: "These schemes do not allow holding another scholarship at the same time: {names}. Please choose one."
choose: "Reply with the number of the scheme you want."
no_scheme: "I could not find a scheme you clearly qualify for yet. A human helper can check the unknown ones."
plan_header: "Documents for {name}:"
plan_missing: "Missing: {label}. Where to get it: {where}."
plan_ok: "You have all the required documents."
plan_next: "Upload the missing documents, or reply 'continue' to go on."
fill_errors: "I found problems in the form: {errors}"
review_header: "Please check each value. Reply yes to confirm everything, or no to change something."
confirmed: "Thank you. Your confirmation is recorded. Submitting to the simulated portal now."
submitted: "Submitted to the simulated portal. Your application id is {app_id}. Current status: {status}."
declined: "Okay, nothing was submitted. Tell me what you want to change."
refused: "I cannot do that. I only follow your instructions through the confirmation step, and nothing is submitted without your explicit yes."
tracking: "Current status: {status}."
deadline: "Deadline: {deadline}. Please verify the date on the official portal."
